name: Build MisaMod Film - Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build-unsigned:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      PROJECT: MisaModFilm.xcodeproj
      SCHEME: MisaModFilm
      CONFIGURATION: Release
      DERIVED_DATA: ${{ github.workspace }}/build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -showsdks
          xcodebuild -list -project "$PROJECT"

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -o pipefail
          rm -rf "$DERIVED_DATA" Payload MisaModFilm-unsigned.ipa build.log
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED_DATA" \
            SDKROOT=iphoneos \
            SUPPORTED_PLATFORMS=iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | tee build.log

      - name: Verify built app and icon
        run: |
          set -euo pipefail
          APP="$DERIVED_DATA/Build/Products/Release-iphoneos/MisaModFilm.app"
          test -d "$APP"
          test -f "$APP/Info.plist"
          test -f "$APP/Assets.car"
          test -f "$APP/MisaModFilm"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$APP/Info.plist"
          /usr/bin/file "$APP/MisaModFilm"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$DERIVED_DATA/Build/Products/Release-iphoneos/MisaModFilm.app"
          mkdir -p Payload
          cp -R "$APP" Payload/MisaModFilm.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload MisaModFilm-unsigned.ipa
          test -s MisaModFilm-unsigned.ipa
          unzip -t MisaModFilm-unsigned.ipa
          unzip -l MisaModFilm-unsigned.ipa | grep -F 'Payload/MisaModFilm.app/Assets.car'
          ls -lh MisaModFilm-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MisaMod-Film-unsigned-IPA
          path: MisaModFilm-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MisaMod-Film-build-log
          path: build.log
          if-no-files-found: ignore
