name: Build MisaMod Film - Unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build-unsigned:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: |
          xcodebuild -version
          xcodebuild -list -project MisaModFilm.xcodeproj
      - name: Validate AppIcon source
        run: |
          set -euo pipefail
          /usr/bin/sips -g pixelWidth -g pixelHeight MisaModFilm/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          cat MisaModFilm/Assets.xcassets/AppIcon.appiconset/Contents.json
      - name: Build unsigned app
        run: |
          set -o pipefail
          rm -rf build Payload MisaModFilm-unsigned.ipa
          xcodebuild build \
            -project MisaModFilm.xcodeproj \
            -scheme MisaModFilm \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SDKROOT=iphoneos \
            ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon \
            | tee build.log
      - name: Verify app
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release-iphoneos/MisaModFilm.app"
          test -d "$APP"
          test -f "$APP/Assets.car"
          test -f "$APP/MisaModFilm"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$APP/Info.plist"
          /usr/bin/file "$APP/MisaModFilm"
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release-iphoneos/MisaModFilm.app"
          mkdir -p Payload
          cp -R "$APP" Payload/MisaModFilm.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload MisaModFilm-unsigned.ipa
          unzip -t MisaModFilm-unsigned.ipa >/dev/null
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MisaMod-Film-unsigned-IPA
          path: MisaModFilm-unsigned.ipa
          retention-days: 14
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MisaMod-Film-build-log
          path: build.log
          if-no-files-found: ignore
